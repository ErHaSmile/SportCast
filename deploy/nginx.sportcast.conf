# 赛播云 SportCast — Nginx 反代示例
# 安装：sudo cp deploy/nginx.sportcast.conf /etc/nginx/conf.d/sportcast.conf
# 修改 server_name 后：sudo nginx -t && sudo systemctl reload nginx

upstream sportcast_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # 改成你的域名，或公网 IP
    server_name 106.15.76.192 _;

    # 后台上传回放视频（最大约 200MB）
    client_max_body_size 210m;

    # 可选：上传静态文件由 Nginx 直出（减轻 Node 压力）
    location /uploads/ {
        alias /opt/sportcast/public/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri @next;
    }

    location @next {
        proxy_pass http://sportcast_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://sportcast_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }
}
